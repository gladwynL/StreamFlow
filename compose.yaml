# StreamFlow local stack.
#
#   Infrastructure only (for running the apps from an IDE):  docker compose up -d
#   Full stack:                                              docker compose --profile app up -d --build
#
# Requires a .env file (copy .env.example). Every published port is bound to 127.0.0.1.
name: streamflow

x-app: &app
  image: streamflow-app:local
  environment: &app-env
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamflow
    SPRING_DATASOURCE_USERNAME: streamflow
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  profiles: [app]

services:
  kafka:
    image: ${KAFKA_IMAGE:?Set KAFKA_IMAGE in .env}
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker: internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created only by the migrate role, so a typo fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - 127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Port check only (a CLI-based check would start a JVM every interval). The migrate
      # role then waits for Kafka to answer admin requests before provisioning topics.
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 1g

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    environment:
      POSTGRES_DB: streamflow
      POSTGRES_USER: streamflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50
      - -c
      - max_wal_size=1GB
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamflow -d streamflow"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 768m

  migrate:
    <<: *app
    build:
      context: ./backend
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: migrate
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  api:
    <<: *app
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m

  worker:
    <<: *app
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m

  # One-shot seeded simulation run; exits 0 PASS, 2 FAIL, 3 INCOMPLETE after reconciling.
  # With the app profile running:  docker compose run --rm --no-deps generate
  generate:
    <<: *app
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: generate
      STREAMFLOW_GENERATE_SEED: ${STREAMFLOW_GENERATE_SEED:-42}
      STREAMFLOW_GENERATE_EVENTS: ${STREAMFLOW_GENERATE_EVENTS:-10000}
      STREAMFLOW_GENERATE_RATE_PER_SECOND: ${STREAMFLOW_GENERATE_RATE_PER_SECOND:-1000}
      STREAMFLOW_GENERATE_DRAIN_TIMEOUT: ${STREAMFLOW_GENERATE_DRAIN_TIMEOUT:-300s}
    # Runs against an already running stack, so it declares no dependencies.
    restart: "no"
    mem_limit: 512m
    profiles: [generate]

  web:
    build:
      context: ./frontend
    image: streamflow-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${WEB_HOST_PORT:-8080}:8080
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    mem_limit: 64m
    profiles: [app]

volumes:
  kafka-data:
  postgres-data:
