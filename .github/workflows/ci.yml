name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests, Testcontainers integration tests (real Kafka and PostgreSQL),
      # ArchUnit rules, Spotless formatting check and JaCoCo reports.
      - run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/*/target/surefire-reports
            backend/*/target/failsafe-reports
          retention-days: 7

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: Compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with a throwaway password
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
      - name: Validate Compose configuration
        run: docker compose --profile app config --quiet
      - name: Build and start the full stack
        run: docker compose --profile app up --detach --build --wait --wait-timeout 300
      - name: Check the dashboard and the status API through nginx
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/system/status | tee status.json
          echo
          jq -e '.status == "OK" and .kafka.reachable and .database.schemaVersion == "3" and ([.workers[] | select(.live)] | length) >= 1' status.json
      # Phase 2 acceptance: 100,000 events at 1,000 events/s must reconcile exactly (exit status 0 = PASS).
      - name: Publish a 100,000-event seeded run and require it to reconcile as PASS
        run: |
          docker compose --profile app run --rm --no-deps \
            -e STREAMFLOW_GENERATE_EVENTS=100000 \
            -e STREAMFLOW_GENERATE_RATE_PER_SECOND=1000 \
            -e STREAMFLOW_GENERATE_DRAIN_TIMEOUT=600s \
            generate
      - name: Check dead-letter inspection and the operator-key default
        run: |
          curl --fail --silent --show-error "http://127.0.0.1:8080/api/v1/dead-letters?limit=5"
          echo
          # No operator key is configured, so replay must be refused (503), never executed.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST             -H 'Content-Type: application/json' -d '{"ids":[1]}' http://127.0.0.1:8080/api/v1/dead-letters/replay)
          test "$code" = "503"
      - name: Show the stored reconciliation result
        run: |
          docker compose exec -T postgres psql -U streamflow -d streamflow -c \
            "SELECT r.run_id, r.attempted, r.acked, c.result, c.details->>'processed' AS processed,
                    c.details->>'duplicatesSuppressed' AS duplicates, c.checked_at
             FROM run_reconciliations c JOIN simulation_runs r USING (run_id) ORDER BY c.checked_at"
      - name: Show service state and logs
        if: always()
        run: |
          docker compose --profile app ps --all
          docker compose --profile app logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile app down --volumes
