name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests, Testcontainers integration tests (real Kafka and PostgreSQL),
      # ArchUnit rules, Spotless formatting check and JaCoCo reports.
      - run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/*/target/surefire-reports
            backend/*/target/failsafe-reports
          retention-days: 7

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: Compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with a throwaway password
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
      - name: Validate Compose configuration
        run: docker compose --profile app config --quiet
      - name: Build and start the full stack
        run: docker compose --profile app up --detach --build --wait --wait-timeout 300
      - name: Check the dashboard and the status API through nginx
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/system/status | tee status.json
          echo
          jq -e '.status == "OK" and .kafka.reachable and .database.schemaVersion == "1" and ([.workers[] | select(.live)] | length) >= 1' status.json
      - name: Show service state and logs
        if: always()
        run: |
          docker compose --profile app ps --all
          docker compose --profile app logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile app down --volumes
